<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/style.css">

    <title>Корзина</title>
</head>

<body>
    <header class="header">
        <a href="../index.html" class="header__logo">
            <img src="../img/header/logo.svg" alt="LOGO">
            <span>SP-massaje</span>
        </a>
        <form id="search" class="header__search">
            <input type="text" name="search-input" id="search-input">
            <label for="search-submit">
                <input type="submit" name="search-submit" id="search-submit">
            </label>
        </form>
        <div class="header__buttons">
            <a href="./infocity.html" class="header__button">
                <img src="../img/header/bell.svg" alt="ICON">
            </a>
            <a href="#" class="header__button">
                <img src="../img/header/cart.svg" alt="ICON">
            </a>
        </div>
    </header>

    <main class="main main_sides">
        <section class="main__cart cart">
            <div class="container">
                <h1>Номер заказа: #########</h1>
                <div class="cart__info">
                    <div class="cart__block cart__block_dates">
                        <h2>Выберите дату из доступных:</h2>
                    </div>
                    <div class="cart__block cart__block_history">
                        <h2>История заказов:</h2>
                    </div>
                    <div class="cart__block cart__block_cart">
                        <h2>В корзине:</h2>
                        <button class="book-button book-button_small">Оплатить</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>ООО «Blizko»</p>
            <div class="footer__right">
                <a href="#">
                    <img src="../img/footer/tiktok.svg" alt="">
                </a>
                <a href="#">
                    <img src="../img/footer/discord.svg" alt="">
                </a>
                <a href="#">
                    <img src="../img/footer/telegram.svg" alt="">
                </a>
                <a href="#">
                    <img src="../img/footer/whatsapp.svg" alt="">
                </a>
            </div>
        </div>
    </footer>
</body>

</html>
